<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movidesk Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Identidade Rede Damas — tema escuro institucional */
            --rd-bg: #071e33;          /* fundo navy institucional */
            --rd-panel: #0e3a5c;       /* painéis */
            --rd-panel-alt: #0c3352;   /* linhas alternadas do ranking */
            --rd-border: #1b4a70;      /* bordas/linhas */
            --rd-accent: #4aa6dd;      /* azul da marca, legível no escuro (títulos/KPIs) */
            --rd-bar: #0c77ad;         /* barras do ranking */
            --rd-count: #f97316;       /* contagem do pódio (laranja acento Rede Damas) */
            --rd-text: #eaf2f8;        /* texto principal */
            --rd-text-dim: #9fb6c9;    /* texto secundário */
            --rd-grad-a: #0e3a5c;      /* gradiente do cabeçalho (homogêneo com os painéis) */
            --rd-grad-b: #135a8f;
            --rd-orange: #f97316;      /* acento (Etapa 4) */
            --rd-card-border: rgba(255,255,255,.07); /* hairline dos cards */
            --rd-shadow: 0 2px 8px rgba(0,0,0,.22);  /* profundidade sutil */
            --rd-radius: 14px;         /* raio padrão dos cards */
        }

        * { box-sizing: border-box; }
        body {
            font-family: "Inter", 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 16px 32px;
            background: var(--rd-bg);
            color: var(--rd-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 1.2rem;
        }
        /* Cabeçalho institucional (barra Rede Damas) */
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-shrink: 0; background: linear-gradient(135deg, var(--rd-grad-a) 0%, var(--rd-grad-b) 100%); border: 1px solid rgba(255,255,255,.08); border-radius: var(--rd-radius); padding: 14px 28px; margin: 0 auto 16px; max-width: 1800px; width: 100%; box-shadow: var(--rd-shadow); }
        .topbar-brand { display: flex; align-items: center; gap: 16px; }
        .topbar-logo { width: 68px; height: 68px; object-fit: contain; }
        .topbar-lockup { display: flex; flex-direction: column; line-height: 1.15; }
        .topbar-name { font-size: 1rem; font-weight: 600; color: rgba(255,255,255,.8); letter-spacing: .5px; }
        .topbar-title { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: .5px; }
        .topbar-clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
        .clock-time { font-size: 2rem; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
        .clock-updated { font-size: .95rem; color: rgba(255,255,255,.75); }

        /* Aviso de dados desatualizados */
        .stale-banner { display: none; background: #7c2d12; color: #fed7aa; border: 1px solid #ea580c; border-radius: 8px; padding: 12px 18px; margin: 0 auto 16px; max-width: 1700px; width: 100%; font-weight: bold; }
        .stale-banner.visible { display: block; }

        /* Estrutura de dois painéis (otimizada para TV) */
        #dashboard-container { width: 100%; max-width: 1800px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
        #main-flex { display: flex; gap: 32px; justify-content: center; align-items: stretch; width: 100%; flex: 1; }
        #left-panel { flex: 9; min-width: 500px; display: flex; flex-direction: column; }
        #right-panel { flex: 8; min-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        /* KPIs (grade 2x2) */
        #kpis { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px; }
        .kpi { background: var(--rd-panel); border: 1px solid var(--rd-card-border); border-radius: var(--rd-radius); box-shadow: var(--rd-shadow); padding: 18px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .kpi-value { font-size: 3rem; font-weight: bold; color: var(--rd-accent); }
        .kpi-label { font-size: 1.1rem; color: var(--rd-text-dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }

        /* Tabela de tickets */
        #tickets-table-container { background: var(--rd-panel); border: 1px solid var(--rd-card-border); border-radius: var(--rd-radius); box-shadow: var(--rd-shadow); padding: 16px 28px; flex: 1; display: flex; flex-direction: column; }
        #tickets-table-container h2 { color: var(--rd-accent); margin-top: 0; font-size: 1.6rem; flex: 0 0 auto; }
        #tickets-table-container table { flex: 1 1 auto; height: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--rd-border); }
        th { color: var(--rd-text-dim); font-size: 0.95rem; text-transform: uppercase; }
        td.empty { text-align: center; color: var(--rd-text-dim); }

        /* Status de SLA (cores por significado) */
        .sla-avencer { color: #eab308; font-weight: bold; }
        .sla-vencido { color: #f87171; font-weight: bold; }
        .sla-novo { color: #93c5fd; font-weight: bold; }

        /* Ranking de responsáveis (painel esquerdo) */
        #owner-rank-container { background: var(--rd-panel); border: 1px solid var(--rd-card-border); border-radius: var(--rd-radius); box-shadow: var(--rd-shadow); padding: 18px 20px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .owner-rank-title { color: var(--rd-accent); font-size: 1.8rem; margin: 0 0 14px; text-align: center; }
        .owner-rank-podium { display: flex; justify-content: center; align-items: flex-end; gap: 40px; margin-bottom: 18px; }
        .owner-rank-podium-item { display: flex; flex-direction: column; align-items: center; }
        .owner-rank-podium-avatar { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 4px solid var(--rd-accent); }
        .owner-rank-podium-name { margin-top: 10px; font-weight: bold; font-size: 1.1rem; }
        .owner-rank-podium-count { color: var(--rd-count); font-size: 1.3rem; font-weight: bold; }
        #carousel-table-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
        .owner-rank-list { width: 100%; border-collapse: collapse; }
        .owner-rank-list th, .owner-rank-list td { color: var(--rd-text); font-size: 1.15rem; padding: 10px 8px; }
        .owner-rank-list tr:nth-child(odd) { background: var(--rd-panel-alt); }
        .owner-rank-list .owner-cell { display: flex; align-items: center; gap: 10px; }
        .owner-rank-list-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--rd-bg); }
        .bar-wrap { display: flex; align-items: center; }
        .bar { background: var(--rd-bar); height: 20px; border-radius: 8px; min-width: 10px; max-width: 100%; transition: width 0.5s; }
        .bar-count { font-weight: bold; color: var(--rd-text); margin-left: 8px; white-space: nowrap; }
        .carousel-page { text-align: center; margin-top: 10px; color: var(--rd-text-dim); }

        /* Responsividade (telas menores que a TV) */
        @media (max-width: 1400px) {
            #main-flex { flex-direction: column; gap: 24px; align-items: stretch; }
            #left-panel, #right-panel { max-width: none; min-width: auto; }
        }
        @media (max-width: 768px) {
            body { font-size: 1rem; padding: 16px; }
            h1 { font-size: 2rem; }
            #kpis { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); }
            .kpi-value { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <img src="/static/img/logo_branco.svg" alt="Rede Damas" class="topbar-logo">
            <div class="topbar-lockup">
                <span class="topbar-name">Rede Damas</span>
                <span class="topbar-title">GESTÃO À VISTA</span>
            </div>
        </div>
        <div class="topbar-clock">
            <span id="clock" class="clock-time">--:--:--</span>
            <span id="clock-updated" class="clock-updated"></span>
        </div>
    </header>

    <div id="stale-banner" class="stale-banner" role="status" aria-live="polite"></div>

    <div id="dashboard-container">
        <div id="main-flex">
            <div id="left-panel">
                <div id="owner-rank-container"></div>
            </div>
            <div id="right-panel">
                <div id="kpis">
                    <div class="kpi"><div class="kpi-value" id="kpi-total">0</div><div class="kpi-label">Total de Tickets</div></div>
                    <div class="kpi"><div class="kpi-value" id="kpi-novos">0</div><div class="kpi-label">Tickets Novos</div></div>
                    <div class="kpi"><div class="kpi-value" id="kpi-abertos">0</div><div class="kpi-label">Em Atendimento</div></div>
                    <div class="kpi"><div class="kpi-value" id="kpi-parados">0</div><div class="kpi-label">Parados</div></div>
                </div>
                <div id="tickets-table-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Backend injeta os tickets e o token (opaco) do painel atual aqui.
        window.tickets = {{ tickets | tojson | safe }};
        window.token = {{ token | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
