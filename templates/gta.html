<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movidesk Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gta.css') }}">
    {% if mostrar_perf %}<link rel="stylesheet" href="{{ url_for('static', filename='css/performance.css') }}">{% endif %}
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <img src="/static/img/logo_branco.svg" alt="Rede Damas" class="topbar-logo">
            <div class="topbar-lockup">
                <span class="topbar-name">Rede Damas</span>
                <span class="topbar-title">GESTÃO À VISTA</span>
            </div>
        </div>
        <div class="topbar-center">
            {% if exibicao and exibicao.nome %}<span class="panel-dept">{{ exibicao.nome }}</span>{% endif %}
            <div id="team-badge" class="team-badge">
                <span id="team-badge-name" class="team-badge-name"></span>
                <span id="team-badge-pos" class="team-badge-pos"></span>
            </div>
        </div>
        <div class="topbar-clock">
            <span id="clock" class="clock-time">--:--:--</span>
            <span id="clock-updated" class="clock-updated"></span>
        </div>
    </header>

    <div id="stale-banner" class="stale-banner" role="status" aria-live="polite"></div>

    <div id="dashboard-container">
        <div id="main-flex">
            <div id="left-panel">
                <div id="owner-rank-container"></div>
            </div>
            <div id="right-panel">
                <div id="kpis">
                    <div class="kpi"><div class="kpi-value" id="kpi-total">0</div><div class="kpi-label">Total de Tickets</div></div>
                    <div class="kpi"><div class="kpi-value" id="kpi-novos">0</div><div class="kpi-label">Tickets Novos</div></div>
                    <div class="kpi"><div class="kpi-value" id="kpi-abertos">0</div><div class="kpi-label">Em Atendimento</div></div>
                    <div class="kpi"><div class="kpi-value" id="kpi-parados">0</div><div class="kpi-label">Parados</div></div>
                </div>
                <div id="tickets-table-container"></div>
            </div>
        </div>
        {% if mostrar_perf %}<div id="view-perf"></div>{% endif %}
    </div>

    <script>
        // Backend injeta os tickets e o token (opaco) do painel atual aqui.
        window.tickets = {{ tickets | tojson | safe }};
        window.setor = {{ setor | tojson | safe }};
        window.exibicao = {{ exibicao | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}" type="module"></script>
    {% if mostrar_perf %}<script src="{{ url_for('static', filename='js/performance.js') }}" type="module"></script>{% endif %}
</body>
</html>
